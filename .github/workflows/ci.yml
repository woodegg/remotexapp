name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - name: Install native and web build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxtst-dev libxdo3 ripgrep \
            xvfb xclip dbus-x11 xfce4-clipman
          npm install --global esbuild@0.20.1
      - run: make check
      - run: make coverage-check
      - run: make vuln-check
      - run: make release-metadata-check
      - name: Verify generated browser assets are committed
        run: git diff --exit-code -- cmd/remotexappd/web/assets cmd/remotexappd/web/sdk/generated-asset-urls.js
