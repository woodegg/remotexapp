name: Diagnose issue 52
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipboard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - name: Install native and web build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxtst-dev libxdo3 ripgrep \
            xvfb xclip dbus-x11 xfce4-clipman
          npm install --global esbuild@0.20.1
      - name: Record dependency versions
        run: dpkg-query -W xfce4-clipman libxfce4ui-2-0 libgtk-3-0t64 xvfb xclip
      - name: Reproduce clipboard owner transitions
        run: go test ./cmd/novnc-input -run '^TestXClipboardBridgeExpiryAndClipmanStaleReplay$' -count=20 -v
