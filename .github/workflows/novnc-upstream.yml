name: Update noVNC upstream

on:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Compare stable releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./third_party/novnc/UPSTREAM.json').release")"
          latest="$(gh api repos/novnc/noVNC/releases/latest --jq .tag_name)"
          canonical_branch="deps/novnc-${latest#v}"
          echo "current=$current" >>"$GITHUB_OUTPUT"
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "version=${latest#v}" >>"$GITHUB_OUTPUT"
          if [[ "$current" == "$latest" ]]; then
            echo "update=false" >>"$GITHUB_OUTPUT"
            echo "Vendored noVNC is current: $current"
            exit 0
          fi
          existing="$(gh pr list --state open --head "$canonical_branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "update=false" >>"$GITHUB_OUTPUT"
            echo "An update pull request already exists: $existing"
            exit 0
          fi
          branch="$canonical_branch"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${canonical_branch}-${GITHUB_RUN_ID}"
          fi
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "update=true" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.update == 'true'
        with:
          node-version: "22.x"

      - name: Install pinned asset builder
        if: steps.release.outputs.update == 'true'
        run: npm install --global esbuild@0.20.1

      - name: Import and commit release
        if: steps.release.outputs.update == 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          ./scripts/update-novnc.sh "$VERSION"
          git add third_party/novnc \
            cmd/remotexappd/web/assets \
            cmd/remotexappd/web/sdk/generated-asset-urls.js
          if git diff --cached --quiet; then
            echo "no update changes were generated" >&2
            exit 1
          fi
          git commit -m "upgrade vendored noVNC to ${RELEASE}"
          git push --set-upstream origin "$BRANCH"

      - name: Open draft pull request
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          CURRENT: ${{ steps.release.outputs.current }}
          RELEASE: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          base="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
          commit="$(node -p "require('./third_party/novnc/UPSTREAM.json').commit")"
          checksum="$(node -p "require('./third_party/novnc/UPSTREAM.json').archiveSha256")"
          body="$(mktemp)"
          printf '%s\n' \
            "## Upstream update" \
            "" \
            "- Previous release: \`$CURRENT\`" \
            "- New release: [\`$RELEASE\`](https://github.com/novnc/noVNC/releases/tag/$RELEASE)" \
            "- Peeled commit: \`$commit\`" \
            "- Archive SHA-256: \`$checksum\`" \
            "" \
            "This PR was generated by the scheduled noVNC updater. It vendors the complete reviewed \`core/\` and \`vendor/\` trees and regenerates embedded assets." \
            "" \
            "## Merge gate" \
            "" \
            "- [ ] Automated Verify workflow passes" \
            "- [ ] Upstream release notes and license/source diff reviewed" \
            "- [ ] Bundle-size change reviewed" \
            "- [ ] Real RFB render, pointer/wheel, and resize verified" \
            "- [ ] English/Chinese IME switching and first character verified" \
            "- [ ] Disconnect/reconnect and vacancy cleanup verified" \
            "" \
            "Do not enable auto-merge. Follow \`docs/operations.md\` before marking this PR ready." >"$body"
          gh pr create \
            --base "$base" \
            --head "$BRANCH" \
            --title "upgrade vendored noVNC to $RELEASE" \
            --body-file "$body" \
            --draft
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Report automation failure
        if: failure() && steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          title="Automated noVNC $RELEASE update failed"
          existing="$(gh issue list --state open --search "$title in:title" --json title --jq ".[] | select(.title == \"$title\") | .title")"
          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "$title" \
              --body "The scheduled importer could not create the $RELEASE update PR. Review [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and the noVNC compatibility boundary before retrying."
          fi
